<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mediaGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mediaGlow)"/>
  
  <!-- Dynamic fluid ink ripples & particles -->
  <circle cx="400" cy="300" r="190" stroke="#3d6d99" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="400" cy="300" r="140" stroke="#68a3d6" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="400" cy="300" r="90" stroke="#b0d8fc" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="400" cy="300" r="40" fill="#f0f7ff" opacity="0.9"/>

  <!-- Play icon overlay -->
  <g transform="translate(375, 275)">
    <circle cx="25" cy="25" r="45" fill="#b93b3b" opacity="0.9"/>
    <polygon points="18,12 38,25 18,38" fill="#ffffff"/>
  </g>

  <text x="400" y="470" font-family="'Noto Serif KR', serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">빙호영월(氷壺迎月) - 4K 미디어 파사드</text>
  <text x="400" y="505" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#89a0ba" text-anchor="middle">빛과 수묵의 상호작용 비디오 인스톨레이션 (04:30 Loop)</text>
</svg>