<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0d0f12"/>
  
  <!-- Museum Gallery Space perspective -->
  <polygon points="0,0 800,0 680,120 120,120" fill="#181c22"/>
  <polygon points="0,600 800,600 680,480 120,480" fill="#14171c"/>
  <polygon points="0,0 120,120 120,480 0,600" fill="#1e2229"/>
  <polygon points="800,0 680,120 680,480 800,600" fill="#1a1e24"/>
  <rect x="120" y="120" width="560" height="360" fill="#0f1114"/>

  <!-- Suspended translucent Korean paper scrolls with ink & light -->
  <g opacity="0.85">
    <rect x="220" y="140" width="70" height="280" fill="#ffffff" opacity="0.25"/>
    <path d="M 230 180 Q 255 240, 245 340" stroke="#000" stroke-width="12" opacity="0.8"/>
    
    <rect x="340" y="160" width="85" height="260" fill="#ffffff" opacity="0.35"/>
    <path d="M 370 200 Q 395 270, 360 380" stroke="#000" stroke-width="18" opacity="0.85"/>
    <circle cx="382" cy="280" r="16" fill="#b93b3b" opacity="0.8"/>

    <rect x="480" y="130" width="75" height="300" fill="#ffffff" opacity="0.28"/>
    <path d="M 510 160 Q 530 250, 495 360" stroke="#000" stroke-width="14" opacity="0.8"/>
  </g>
  <!-- Floor reflection -->
  <ellipse cx="400" cy="500" rx="260" ry="25" fill="#2d3744" opacity="0.4"/>

  <text x="400" y="550" font-family="'Noto Serif KR', serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">시공간의 묵향(墨香) · 2021 칠묵미술관</text>
  <text x="400" y="575" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#8893a0" text-anchor="middle">Large-scale Spatial Hanji & Light Installation Art</text>
</svg>