<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="photoSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="45%" stop-color="#2d3f57"/>
      <stop offset="75%" stop-color="#bf8c5d"/>
      <stop offset="100%" stop-color="#e8bf8c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="30%" stop-color="#f5c276" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2d3f57" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#photoSky)"/>
  <circle cx="560" cy="380" r="160" fill="url(#sunGlow)"/>

  <!-- Golden light beam across cloud tops -->
  <path d="M 0 420 Q 250 360, 560 380 T 800 350 L 800 600 L 0 600 Z" fill="#1b2533" opacity="0.9"/>
  <!-- Billowing cloud deck photographed from summit -->
  <ellipse cx="200" cy="480" rx="180" ry="60" fill="#a87d5b" opacity="0.5"/>
  <ellipse cx="450" cy="460" rx="220" ry="70" fill="#e2af7b" opacity="0.6"/>
  <ellipse cx="700" cy="490" rx="200" ry="65" fill="#f3cb9b" opacity="0.7"/>
  <path d="M 0 480 Q 200 440, 400 470 T 800 460 L 800 600 L 0 600 Z" fill="#0d141d"/>

  <text x="40" y="550" font-family="'Noto Serif KR', serif" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="2">빛과 하늘의 서사 · 제3망</text>
  <text x="40" y="575" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#cfd6e0">Digital Fine Art Photography · Thomas Yang</text>
</svg>