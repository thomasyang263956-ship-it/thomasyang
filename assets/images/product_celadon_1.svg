<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f2f5f4"/>
  <defs>
    <radialGradient id="teaPotGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c1e3da"/>
      <stop offset="50%" stop-color="#72a89a"/>
      <stop offset="100%" stop-color="#3c6b5e"/>
    </radialGradient>
  </defs>

  <!-- Wooden tea tray -->
  <rect x="80" y="380" width="440" height="40" rx="8" fill="#4a3728"/>
  
  <!-- Modern Celadon Teapot & Cups Set -->
  <!-- Teapot -->
  <g transform="translate(240, 220)">
    <!-- Lid handle -->
    <circle cx="0" cy="15" r="10" fill="#c1e3da"/>
    <!-- Lid -->
    <ellipse cx="0" cy="30" rx="42" ry="14" fill="#72a89a"/>
    <!-- Body -->
    <ellipse cx="0" cy="95" rx="75" ry="60" fill="url(#teaPotGrad)"/>
    <!-- Spout -->
    <path d="M 65 75 Q 115 50, 110 35 L 98 42 Q 95 65, 60 90 Z" fill="#72a89a"/>
    <!-- Handle -->
    <path d="M -60 70 Q -115 85, -95 125 Q -80 145, -55 120" stroke="#72a89a" stroke-width="12" fill="none"/>
  </g>

  <!-- Teacup 1 -->
  <g transform="translate(390, 310)">
    <path d="M -25 0 C -25 40, 25 40, 25 0 Z" fill="url(#teaPotGrad)"/>
  </g>
  <!-- Teacup 2 -->
  <g transform="translate(450, 320)">
    <path d="M -22 0 C -22 35, 22 35, 22 0 Z" fill="url(#teaPotGrad)"/>
  </g>

  <text x="300" y="475" font-family="'Noto Serif KR', serif" font-size="18" font-weight="bold" fill="#224237" text-anchor="middle">현대 비색 청자 5인 다기 세트</text>
  <text x="300" y="505" font-family="'Noto Sans KR', sans-serif" font-size="12" fill="#58756c" text-anchor="middle">전통 장작 가마 비색 재현 · 현대적 라이프스타일 디자인 다관</text>
</svg>