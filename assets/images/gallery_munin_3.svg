<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <filter id="paperTex">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.3"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <!-- Rice paper background -->
  <rect width="720" height="480" fill="#f4f0e8"/>
  <rect width="720" height="480" fill="#ede8d8" opacity="0.5" filter="url(#paperTex)"/>
  <!-- Border frame -->
  <rect x="20" y="20" width="680" height="440" fill="none" stroke="#c8b898" stroke-width="1.5" opacity="0.6"/>
  <rect x="28" y="28" width="664" height="424" fill="none" stroke="#c8b898" stroke-width="0.5" opacity="0.4"/>
  <!-- Main branch - dark ink -->
  <path d="M80,480 Q90,380 120,320 Q150,260 180,200 Q200,160 230,120 Q250,90 270,60" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Secondary branches -->
  <path d="M230,120 Q280,100 350,80 Q400,65 460,50" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M270,60 Q310,40 370,30 Q410,22 460,20" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M180,200 Q230,180 290,170 Q340,162 390,155" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120,320 Q170,300 230,290 Q270,284 310,278" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tertiary thin branches -->
  <path d="M460,50 Q490,38 520,30" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M390,155 Q420,142 450,135" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Red plum blossoms - circles -->
  <g fill="#cc2222">
    <circle cx="460" cy="50" r="9"/>
    <circle cx="490" cy="38" r="7"/>
    <circle cx="520" cy="30" r="8"/>
    <circle cx="380" cy="30" r="8"/>
    <circle cx="420" cy="22" r="6"/>
    <circle cx="460" cy="20" r="7"/>
    <circle cx="390" cy="155" r="8"/>
    <circle cx="420" cy="142" r="7"/>
    <circle cx="450" cy="135" r="8"/>
    <circle cx="310" cy="278" r="7"/>
    <circle cx="330" cy="265" r="6"/>
    <circle cx="345" cy="285" r="8"/>
  </g>
  <!-- Blossom centers -->
  <g fill="#f4c0c0" opacity="0.8">
    <circle cx="460" cy="50" r="3"/>
    <circle cx="490" cy="38" r="2.5"/>
    <circle cx="520" cy="30" r="3"/>
    <circle cx="380" cy="30" r="3"/>
    <circle cx="390" cy="155" r="3"/>
    <circle cx="420" cy="142" r="2.5"/>
  </g>
  <!-- Fallen petals on ground -->
  <g fill="#cc2222" opacity="0.5">
    <circle cx="380" cy="445" r="4"/>
    <circle cx="400" cy="455" r="3"/>
    <circle cx="420" cy="440" r="4"/>
    <circle cx="440" cy="450" r="3"/>
  </g>
  <!-- Vertical text -->
  <text x="690" y="80" font-family="'Noto Serif KR', serif" font-size="18" fill="#3a2a1a" opacity="0.8" writing-mode="tb" letter-spacing="4">梁太白</text>
  <!-- Small seal -->
  <rect x="600" y="420" width="50" height="40" rx="2" fill="#cc2222" opacity="0.15"/>
  <text x="625" y="445" font-family="'Noto Serif KR', serif" font-size="11" fill="#cc2222" opacity="0.7" text-anchor="middle">한겨울홍매</text>
</svg>
