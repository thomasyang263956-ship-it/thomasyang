<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <radialGradient id="strokeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="720" height="480" fill="#1a1a1a"/>
  <!-- Calligraphy brush strokes in white -->
  <!-- Main stroke 1 - large sweeping -->
  <path d="M100,80 Q200,120 180,250 Q160,350 240,420" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Motion blur duplicate -->
  <path d="M100,80 Q200,120 180,250 Q160,350 240,420" stroke="#ffffff" stroke-width="30" fill="none" stroke-linecap="round" opacity="0.1"/>
  <!-- Main stroke 2 -->
  <path d="M300,60 Q350,180 300,300 Q260,380 350,440" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M300,60 Q350,180 300,300 Q260,380 350,440" stroke="#ffffff" stroke-width="38" fill="none" stroke-linecap="round" opacity="0.08"/>
  <!-- Main stroke 3 -->
  <path d="M480,100 Q520,200 500,340 Q490,400 560,450" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Cross strokes -->
  <path d="M80,180 Q200,170 350,185 Q500,200 640,175" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M120,310 Q250,295 400,310 Q550,325 680,300" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Ink splatter dots -->
  <circle cx="150" cy="300" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="155" cy="310" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="160" cy="295" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="400" cy="150" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="410" cy="160" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="600" cy="380" r="4" fill="#ffffff" opacity="0.5"/>
  <!-- Play button in center -->
  <circle cx="360" cy="240" r="50" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <polygon points="345,220 345,260 385,240" fill="#ffffff" opacity="0.9"/>
  <!-- 4K badge -->
  <rect x="620" y="20" width="60" height="24" rx="3" fill="#ffffff" opacity="0.9"/>
  <text x="650" y="37" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4K</text>
  <!-- Artist text -->
  <text x="680" y="450" font-family="'Noto Serif KR', serif" font-size="16" fill="#aaaaaa" opacity="0.9" text-anchor="end">梁太白</text>
  <text x="30" y="460" font-family="'Noto Serif KR', serif" font-size="13" fill="#888888" opacity="0.8">서예의 호흡 · 라이브 퍼포먼스</text>
</svg>
