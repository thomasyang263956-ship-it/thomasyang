<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#080b10"/>
  <!-- Long exposure light trails and architectural reflections -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="1.5"/>
  <path d="M 0 450 Q 400 350, 800 480" stroke="#ef4444" stroke-width="4" opacity="0.8"/>
  <path d="M 0 470 Q 400 380, 800 500" stroke="#eab308" stroke-width="3" opacity="0.8"/>
  <path d="M 0 490 Q 400 410, 800 520" stroke="#38bdf8" stroke-width="3.5" opacity="0.85"/>
  <!-- Skyscraper silhouettes -->
  <rect x="180" y="140" width="60" height="280" fill="#1e293b"/>
  <rect x="260" y="90" width="85" height="330" fill="#0f172a"/>
  <rect x="365" y="180" width="55" height="240" fill="#1e293b"/>
  <rect x="440" y="110" width="90" height="310" fill="#0f172a"/>
  <text x="50" y="560" font-family="'Noto Serif KR', serif" font-size="19" font-weight="600" fill="#fff">도시의 침묵과 빛의 잔상</text>
  <text x="50" y="585" font-family="'Noto Sans KR', sans-serif" font-size="12" fill="#94a3b8">Long-exposure Architectural Fine Art · Thomas Yang</text>
</svg>