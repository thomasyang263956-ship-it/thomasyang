<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="soundBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a1a"/>
      <stop offset="50%" stop-color="#0a2a2a"/>
      <stop offset="100%" stop-color="#061520"/>
    </linearGradient>
    <radialGradient id="mistCenter" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1a4a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#061a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soundBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="720" height="480" fill="url(#soundBg)"/>
  <!-- Mist glow -->
  <ellipse cx="360" cy="300" rx="300" ry="120" fill="url(#mistCenter)" filter="url(#soundBlur)"/>
  <!-- Mountain silhouette -->
  <polygon points="0,400 100,300 180,340 260,250 360,200 460,260 540,310 640,280 720,350 720,480 0,480" fill="#082020" opacity="0.9"/>
  <!-- Mist layer -->
  <ellipse cx="360" cy="360" rx="400" ry="40" fill="#1a4a4a" opacity="0.4" filter="url(#soundBlur)"/>
  <ellipse cx="200" cy="370" rx="180" ry="25" fill="#154040" opacity="0.3" filter="url(#soundBlur)"/>
  <ellipse cx="560" cy="365" rx="160" ry="22" fill="#154040" opacity="0.3" filter="url(#soundBlur)"/>
  <!-- Musical note symbols floating -->
  <g fill="#40c8c8" opacity="0.7" font-family="serif" font-size="36">
    <text x="150" y="180">♩</text>
    <text x="250" y="140">♪</text>
    <text x="400" y="120">♫</text>
    <text x="520" y="160">♬</text>
    <text x="600" y="200">♩</text>
    <text x="80" y="250">♪</text>
    <text x="650" y="130">♫</text>
  </g>
  <!-- Sound wave lines -->
  <g stroke="#30a0a0" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M100,220 Q180,200 260,220 Q340,240 420,220 Q500,200 580,220 Q640,235 680,220"/>
    <path d="M100,235 Q180,210 260,235 Q340,260 420,235 Q500,210 580,235 Q640,255 680,235"/>
    <path d="M100,250 Q180,220 260,250 Q340,280 420,250 Q500,220 580,250 Q640,275 680,250"/>
  </g>
  <!-- Play button -->
  <circle cx="360" cy="240" r="48" fill="none" stroke="#40c8c8" stroke-width="2" opacity="0.9"/>
  <polygon points="347,218 347,262 387,240" fill="#40c8c8" opacity="0.9"/>
  <!-- Artist text -->
  <text x="680" y="450" font-family="'Noto Serif KR', serif" font-size="16" fill="#40c0c0" opacity="0.8" text-anchor="end">梁太白</text>
  <text x="30" y="460" font-family="'Noto Serif KR', serif" font-size="13" fill="#30a0a0" opacity="0.8">운무 속 선율 · 사운드스케이프</text>
</svg>
