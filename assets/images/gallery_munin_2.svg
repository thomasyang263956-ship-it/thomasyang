<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#faf7f0"/>
  <!-- Bamboo stems and sharp leaves -->
  <g stroke="#1a1c1e" stroke-linecap="round">
    <!-- Stalk 1 -->
    <line x1="280" y1="580" x2="280" y2="440" stroke-width="16"/>
    <line x1="280" y1="430" x2="280" y2="290" stroke-width="15"/>
    <line x1="280" y1="280" x2="280" y2="140" stroke-width="14"/>
    <line x1="280" y1="130" x2="280" y2="30" stroke-width="12"/>
    <!-- Stalk 2 -->
    <line x1="360" y1="580" x2="350" y2="420" stroke-width="18"/>
    <line x1="350" y1="410" x2="340" y2="260" stroke-width="17"/>
    <line x1="340" y1="250" x2="330" y2="100" stroke-width="15"/>
  </g>
  <!-- Bamboo leaves cluster -->
  <g fill="#1a1c1e">
    <polygon points="280,285 220,310 235,320"/>
    <polygon points="280,285 210,290 220,300"/>
    <polygon points="280,285 240,335 255,340"/>
    <polygon points="340,255 410,270 395,280"/>
    <polygon points="340,255 425,250 410,260"/>
    <polygon points="340,255 385,295 375,300"/>
  </g>
  <!-- Inscription -->
  <text x="640" y="100" font-family="'Noto Serif KR', serif" font-size="16" fill="#222" writing-mode="vertical-rl" letter-spacing="6">歲寒然後知松柏之後彫也</text>
  <text x="675" y="140" font-family="'Noto Serif KR', serif" font-size="13" fill="#555" writing-mode="vertical-rl" letter-spacing="4">군자묵죽(君子墨竹) 陽太白</text>
  <g transform="translate(630, 320)">
    <rect width="28" height="28" fill="#b93b3b"/>
    <text x="14" y="13" font-family="'Noto Serif KR', serif" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">太白</text>
    <text x="14" y="23" font-family="'Noto Serif KR', serif" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">印</text>
  </g>
</svg>