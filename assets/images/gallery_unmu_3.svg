<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c8d8"/>
      <stop offset="50%" stop-color="#d4dfe8"/>
      <stop offset="100%" stop-color="#e8eff5"/>
    </linearGradient>
    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d8e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0eaf2" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- Sky background -->
  <rect width="720" height="480" fill="url(#skyGrad)"/>
  <!-- Distant mist layers -->
  <ellipse cx="360" cy="280" rx="400" ry="80" fill="#dce8f0" opacity="0.7" filter="url(#blur2)"/>
  <ellipse cx="200" cy="300" rx="250" ry="60" fill="#c8d8e8" opacity="0.6" filter="url(#blur2)"/>
  <ellipse cx="560" cy="290" rx="220" ry="55" fill="#ccdaec" opacity="0.6" filter="url(#blur2)"/>
  <!-- Far mountain peaks -->
  <polygon points="0,320 80,200 160,280 240,160 320,240 400,140 480,220 560,170 640,230 720,200 720,480 0,480" fill="#6a7a8a" opacity="0.3" filter="url(#blur1)"/>
  <!-- Mid mountains -->
  <polygon points="0,360 100,260 180,310 260,230 340,280 420,210 500,270 580,240 660,290 720,260 720,480 0,480" fill="#3a4a5a" opacity="0.6"/>
  <!-- Cloud/mist band -->
  <ellipse cx="360" cy="340" rx="420" ry="50" fill="#e2ecf5" opacity="0.8" filter="url(#blur1)"/>
  <ellipse cx="150" cy="350" rx="180" ry="35" fill="#d8e8f2" opacity="0.7" filter="url(#blur1)"/>
  <ellipse cx="580" cy="345" rx="160" ry="30" fill="#d8e8f2" opacity="0.7" filter="url(#blur1)"/>
  <!-- Foreground mountains -->
  <polygon points="0,400 120,310 200,360 280,300 360,350 440,290 520,340 620,310 720,360 720,480 0,480" fill="#1e2a36" opacity="0.9"/>
  <!-- Pine trees -->
  <g fill="#1a2530" opacity="0.85">
    <polygon points="80,360 72,395 88,395"/>
    <polygon points="80,350 68,375 92,375"/>
    <rect x="78" y="395" width="4" height="12"/>
    <polygon points="150,340 142,375 158,375"/>
    <polygon points="150,330 138,355 162,355"/>
    <rect x="148" y="375" width="4" height="12"/>
    <polygon points="600,330 592,365 608,365"/>
    <polygon points="600,320 588,345 612,345"/>
    <rect x="598" y="365" width="4" height="12"/>
    <polygon points="650,345 642,380 658,380"/>
    <polygon points="650,335 638,360 662,360"/>
    <rect x="648" y="380" width="4" height="12"/>
  </g>
  <!-- Foreground ground -->
  <rect x="0" y="440" width="720" height="40" fill="#141e28"/>
  <!-- Vertical text -->
  <text x="695" y="80" font-family="'Noto Serif KR', serif" font-size="18" fill="#2a3a4a" opacity="0.8" writing-mode="tb" letter-spacing="4">梁太白</text>
  <!-- Title -->
  <text x="30" y="450" font-family="'Noto Serif KR', serif" font-size="13" fill="#8a9aaa" opacity="0.9">설악 천화대 운해</text>
</svg>
