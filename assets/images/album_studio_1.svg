<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#1a1c1e"/>
  <!-- Studio Table with big brush and ink stone -->
  <rect x="40" y="180" width="520" height="200" rx="6" fill="#332a22"/>
  <rect x="80" y="200" width="360" height="150" fill="#f5f2e8" stroke="#554233" stroke-width="2"/>
  <!-- Large Ink stroke being painted on paper -->
  <path d="M 120 280 Q 220 220, 320 270 T 400 240" stroke="#111" stroke-width="32" stroke-linecap="round" fill="none"/>
  <!-- Huge calligraphy brush and ink stone -->
  <rect x="460" y="220" width="70" height="100" rx="8" fill="#181819"/>
  <circle cx="495" cy="270" r="28" fill="#080809"/>
  <!-- Brush resting -->
  <line x1="430" y1="230" x2="520" y2="330" stroke="#b08b51" stroke-width="8" stroke-linecap="round"/>

  <text x="40" y="420" font-family="'Noto Serif KR', serif" font-size="15" font-weight="bold" fill="#fff">양태백 작가 아틀리에 작업 풍경</text>
  <text x="40" y="440" font-family="'Noto Sans KR', sans-serif" font-size="11" fill="#88929e">전통 수묵과 현대 디자인의 융합을 탐구하는 창작의 현장</text>
</svg>