<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <filter id="pTex">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.2"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <!-- Rice paper background -->
  <rect width="720" height="480" fill="#f2eee0"/>
  <rect width="720" height="480" fill="#eae4d0" opacity="0.4" filter="url(#pTex)"/>
  <!-- Dividing lines for three sections -->
  <line x1="240" y1="30" x2="240" y2="450" stroke="#b8a888" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="30" x2="480" y2="450" stroke="#b8a888" stroke-width="1" opacity="0.5"/>
  <!-- Section headers in Chinese -->
  <text x="120" y="55" font-family="'Noto Serif KR', serif" font-size="16" fill="#4a3a2a" opacity="0.6" text-anchor="middle">蘭</text>
  <text x="360" y="55" font-family="'Noto Serif KR', serif" font-size="16" fill="#4a3a2a" opacity="0.6" text-anchor="middle">菊</text>
  <text x="600" y="55" font-family="'Noto Serif KR', serif" font-size="16" fill="#4a3a2a" opacity="0.6" text-anchor="middle">竹</text>
  <!-- SECTION 1: Orchid leaves -->
  <g stroke="#2a2a2a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M60,420 Q90,350 130,280 Q155,230 140,160"/>
    <path d="M80,420 Q120,355 155,290 Q175,240 165,180"/>
    <path d="M100,420 Q130,370 170,320 Q200,280 195,220"/>
    <path d="M140,380 Q160,330 185,290 Q200,260 190,200"/>
    <path d="M50,400 Q75,340 100,270 Q115,230 100,160"/>
  </g>
  <!-- Orchid tips (lighter) -->
  <g stroke="#555545" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M140,160 Q145,130 135,110"/>
    <path d="M165,180 Q172,150 162,130"/>
    <path d="M100,160 Q104,130 95,110"/>
  </g>
  <!-- SECTION 2: Chrysanthemum petals -->
  <g transform="translate(360,250)">
    <g fill="none" stroke="#2a2a2a" stroke-width="2">
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(0)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(30)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(60)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(90)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(120)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(150)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(180)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(210)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(240)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(270)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(300)"/>
      <ellipse cx="0" cy="-50" rx="10" ry="30" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#2a2a2a"/>
    <!-- Stem and leaves -->
    <path d="M0,0 Q5,60 0,130" stroke="#2a2a2a" stroke-width="2.5" fill="none"/>
    <path d="M2,60 Q30,50 45,65" stroke="#2a2a2a" stroke-width="2" fill="none"/>
    <path d="M1,90 Q-25,80 -38,95" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  </g>
  <!-- SECTION 3: Bamboo stalks -->
  <g stroke="#2a2a2a" fill="none">
    <!-- Stalk 1 -->
    <line x1="540" y1="80" x2="540" y2="440" stroke-width="8"/>
    <g stroke-width="1.5">
      <line x1="535" y1="160" x2="545" y2="160"/>
      <line x1="535" y1="230" x2="545" y2="230"/>
      <line x1="535" y1="300" x2="545" y2="300"/>
      <line x1="535" y1="370" x2="545" y2="370"/>
    </g>
    <!-- Stalk 2 -->
    <line x1="580" y1="100" x2="580" y2="440" stroke-width="6"/>
    <g stroke-width="1.5">
      <line x1="576" y1="180" x2="584" y2="180"/>
      <line x1="576" y1="250" x2="584" y2="250"/>
      <line x1="576" y1="320" x2="584" y2="320"/>
      <line x1="576" y1="390" x2="584" y2="390"/>
    </g>
    <!-- Stalk 3 -->
    <line x1="610" y1="120" x2="610" y2="440" stroke-width="5"/>
    <g stroke-width="1">
      <line x1="607" y1="200" x2="613" y2="200"/>
      <line x1="607" y1="270" x2="613" y2="270"/>
      <line x1="607" y1="340" x2="613" y2="340"/>
    </g>
    <!-- Bamboo leaves -->
    <path d="M545,155 Q570,140 590,145" stroke-width="2" stroke-linecap="round"/>
    <path d="M545,228 Q565,210 580,215" stroke-width="2" stroke-linecap="round"/>
    <path d="M584,245 Q600,228 615,232" stroke-width="2" stroke-linecap="round"/>
    <path d="M545,298 Q568,282 582,286" stroke-width="2" stroke-linecap="round"/>
    <path d="M535,160 Q515,145 500,148" stroke-width="2" stroke-linecap="round"/>
    <path d="M535,300 Q512,285 498,288" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Vertical text -->
  <text x="700" y="90" font-family="'Noto Serif KR', serif" font-size="18" fill="#3a2a1a" opacity="0.8" writing-mode="tb" letter-spacing="4">梁太白</text>
  <text x="30" y="465" font-family="'Noto Serif KR', serif" font-size="13" fill="#6a5a4a" opacity="0.8">묵란 삼청</text>
</svg>
