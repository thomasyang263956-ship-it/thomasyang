<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="uvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inkTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>
  <!-- Very dark background -->
  <rect width="720" height="480" fill="url(#uvBg)"/>
  <!-- Layered ink textures -->
  <g opacity="0.3" fill="#101020">
    <ellipse cx="200" cy="200" rx="180" ry="140"/>
    <ellipse cx="500" cy="300" rx="160" ry="120"/>
    <ellipse cx="360" cy="240" rx="200" ry="150"/>
  </g>
  <!-- Ink wash layers -->
  <path d="M50,100 Q200,80 350,120 Q500,160 650,100 Q700,90 720,100 L720,250 Q600,230 450,260 Q300,290 150,250 Q80,235 50,250 Z" fill="#0d0d20" opacity="0.8"/>
  <path d="M0,200 Q150,180 300,220 Q450,260 600,200 Q680,175 720,200 L720,350 Q580,330 430,360 Q280,390 130,350 Q60,330 0,350 Z" fill="#08080f" opacity="0.8"/>
  <!-- Neon cyan accent lines -->
  <g stroke="#00ffee" stroke-width="1.5" fill="none" filter="url(#neonGlow)" opacity="0.8">
    <path d="M80,120 Q200,100 320,140 Q440,180 560,120 Q640,90 700,110"/>
    <path d="M60,180 Q180,155 300,195 Q420,235 540,175 Q650,130 710,160"/>
    <path d="M100,280 Q220,255 340,295 Q460,335 580,275 Q660,245 710,265"/>
    <path d="M50,360 Q170,335 290,375 Q410,415 530,355 Q640,310 710,340"/>
  </g>
  <!-- Neon magenta accent lines -->
  <g stroke="#ff00cc" stroke-width="1.5" fill="none" filter="url(#neonGlow)" opacity="0.7">
    <path d="M100,150 Q220,170 340,130 Q460,90 580,150 Q660,185 710,160"/>
    <path d="M80,240 Q200,265 320,225 Q440,185 560,245 Q650,280 710,255"/>
    <path d="M120,330 Q240,355 360,315 Q480,275 600,335 Q670,365 710,345"/>
  </g>
  <!-- Small neon dots - dual reality effect -->
  <g fill="#00ffee" filter="url(#neonGlow)" opacity="0.9">
    <circle cx="200" cy="140" r="2"/>
    <circle cx="400" cy="90" r="2"/>
    <circle cx="580" cy="130" r="2"/>
    <circle cx="150" cy="260" r="2"/>
    <circle cx="550" cy="250" r="2"/>
  </g>
  <g fill="#ff00cc" filter="url(#neonGlow)" opacity="0.9">
    <circle cx="300" cy="170" r="2"/>
    <circle cx="480" cy="110" r="2"/>
    <circle cx="650" cy="200" r="2"/>
    <circle cx="250" cy="310" r="2"/>
    <circle cx="620" cy="300" r="2"/>
  </g>
  <!-- Artist text -->
  <text x="680" y="450" font-family="'Noto Serif KR', serif" font-size="16" fill="#00ffee" opacity="0.8" text-anchor="end" filter="url(#neonGlow)">梁太白</text>
  <text x="30" y="460" font-family="'Noto Serif KR', serif" font-size="13" fill="#8080c0" opacity="0.7">빛과 먹의 대화</text>
</svg>
