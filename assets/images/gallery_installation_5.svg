<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="infinBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#030306"/>
    </linearGradient>
    <radialGradient id="centerGlowR" cx="50%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#e8f8ff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#80d8f8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#20a0d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolReflect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40b8e0" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#101828" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Very dark background -->
  <rect width="720" height="480" fill="url(#infinBg)"/>
  <!-- Center bright white/cyan glow -->
  <ellipse cx="360" cy="215" rx="180" ry="140" fill="url(#centerGlowR)" filter="url(#glowF)"/>
  <!-- Concentric dark rectangles suggesting infinite mirror -->
  <!-- Outermost rectangle -->
  <rect x="20" y="20" width="680" height="400" fill="none" stroke="#101418" stroke-width="2"/>
  <rect x="50" y="45" width="620" height="360" fill="none" stroke="#121618" stroke-width="2"/>
  <rect x="80" y="68" width="560" height="318" fill="none" stroke="#141820" stroke-width="2"/>
  <rect x="110" y="90" width="500" height="276" fill="none" stroke="#161c22" stroke-width="2"/>
  <rect x="140" y="112" width="440" height="234" fill="none" stroke="#182028" stroke-width="2"/>
  <rect x="168" y="132" width="384" height="196" fill="none" stroke="#1a2430" stroke-width="2"/>
  <rect x="195" y="150" width="330" height="162" fill="none" stroke="#1e2838" stroke-width="2"/>
  <rect x="220" y="167" width="280" height="130" fill="none" stroke="#202c40" stroke-width="2"/>
  <rect x="244" y="182" width="232" height="102" fill="none" stroke="#243048" stroke-width="2"/>
  <rect x="265" y="195" width="190" height="80" fill="none" stroke="#283450" stroke-width="1.5"/>
  <rect x="285" y="206" width="150" height="60" fill="none" stroke="#2c3858" stroke-width="1.5"/>
  <rect x="303" y="216" width="114" height="44" fill="none" stroke="#303c60" stroke-width="1.5"/>
  <rect x="318" y="224" width="84" height="32" fill="none" stroke="#344070" stroke-width="1"/>
  <rect x="332" y="231" width="56" height="22" fill="none" stroke="#384478" stroke-width="1"/>
  <rect x="343" y="236" width="34" height="14" fill="none" stroke="#3c4880" stroke-width="1"/>
  <!-- Bright center point -->
  <ellipse cx="360" cy="243" rx="8" ry="6" fill="#e0f8ff" filter="url(#glowF)"/>
  <!-- Ink-black pool at bottom -->
  <ellipse cx="360" cy="430" rx="300" ry="40" fill="#04060c"/>
  <ellipse cx="360" cy="430" rx="260" ry="32" fill="#060810"/>
  <ellipse cx="360" cy="430" rx="200" ry="22" fill="#080c16"/>
  <!-- Pool reflection of center light -->
  <ellipse cx="360" cy="430" rx="120" ry="15" fill="url(#poolReflect)" filter="url(#glowF)"/>
  <!-- Cyan light column in center -->
  <line x1="360" y1="243" x2="360" y2="405" stroke="#40c8f0" stroke-width="1.5" opacity="0.3"/>
  <!-- Artist text -->
  <text x="680" y="455" font-family="'Noto Serif KR', serif" font-size="16" fill="#40c8f0" opacity="0.8" text-anchor="end" filter="url(#glowF)">梁太白</text>
  <text x="30" y="460" font-family="'Noto Serif KR', serif" font-size="13" fill="#2090b0" opacity="0.8">무한 경계 · 거울과 먹물</text>
</svg>
