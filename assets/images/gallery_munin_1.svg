<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f6f3eb"/>
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#ece6d8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#paperGlow)"/>
  
  <!-- Ink Orchid & Rock (청향묵란) -->
  <!-- Craggy scholar rock -->
  <path d="M 500 580 C 480 480, 520 420, 570 380 C 620 340, 680 370, 700 440 C 720 500, 750 540, 780 580 Z" fill="#3c3f44" opacity="0.85"/>
  <path d="M 520 570 C 510 500, 540 450, 580 430 C 620 410, 660 440, 670 510 Z" fill="#232528"/>

  <!-- Orchid Leaves (graceful sweeping brushstrokes) -->
  <path d="M 520 480 C 420 410, 320 280, 310 160 C 305 130, 290 120, 275 140 C 265 170, 310 290, 480 470 Z" fill="#1a1c1e"/>
  <path d="M 540 490 C 460 380, 390 220, 380 90 C 375 70, 360 85, 365 115 C 380 230, 440 390, 520 510 Z" fill="#292c30"/>
  <path d="M 560 500 C 530 390, 500 240, 470 140 C 465 120, 450 130, 455 155 C 475 250, 510 400, 545 520 Z" fill="#1b1c1e"/>
  <path d="M 580 480 C 640 400, 690 320, 720 210 C 725 190, 740 200, 735 220 C 710 330, 650 420, 595 500 Z" fill="#2b2d31"/>
  <path d="M 550 510 C 430 460, 330 420, 220 440 C 180 450, 160 435, 190 425 C 290 390, 420 440, 530 505 Z" fill="#1a1c1e"/>

  <!-- Orchid Blossoms & Pistils -->
  <g fill="#43464c">
    <!-- Blossom 1 -->
    <ellipse cx="330" cy="180" rx="14" ry="7" transform="rotate(-30, 330, 180)"/>
    <ellipse cx="342" cy="190" rx="12" ry="6" transform="rotate(40, 342, 190)"/>
    <ellipse cx="320" cy="195" rx="10" ry="5" transform="rotate(80, 320, 195)"/>
    <circle cx="332" cy="188" r="3.5" fill="#a43535"/>
    
    <!-- Blossom 2 -->
    <ellipse cx="400" cy="140" rx="13" ry="6" transform="rotate(-15, 400, 140)"/>
    <ellipse cx="410" cy="150" rx="11" ry="5" transform="rotate(50, 410, 150)"/>
    <ellipse cx="390" cy="152" rx="9" ry="5" transform="rotate(90, 390, 152)"/>
    <circle cx="402" cy="147" r="3.5" fill="#a43535"/>
  </g>

  <!-- Poem Inscription & Seals -->
  <text x="140" y="100" font-family="'Noto Serif KR', serif" font-size="16" fill="#25272a" writing-mode="vertical-rl" letter-spacing="6">幽蘭生深林 芳香結遠風</text>
  <text x="175" y="130" font-family="'Noto Serif KR', serif" font-size="14" fill="#555" writing-mode="vertical-rl" letter-spacing="4">歲在辛丑 梁太白 寫</text>
  
  <g transform="translate(130, 320)">
    <rect width="30" height="30" rx="3" fill="#b93b3b"/>
    <text x="15" y="14" font-family="'Noto Serif KR', serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">陽太</text>
    <text x="15" y="24" font-family="'Noto Serif KR', serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">白印</text>
  </g>
</svg>