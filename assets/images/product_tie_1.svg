<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f4f3ef"/>
  <defs>
    <linearGradient id="tieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2530"/>
      <stop offset="50%" stop-color="#2d3a4b"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
  </defs>

  <!-- Necktie Silhouette -->
  <g transform="translate(300, 50)">
    <!-- Knot -->
    <polygon points="-28,0 28,0 22,45 -22,45" fill="#18202a"/>
    <polygon points="-25,3 25,3 20,42 -20,42" fill="#2d3a4b"/>
    <!-- Blade -->
    <path d="M -22 45 L -45 360 L 0 450 L 45 360 L 22 45 Z" fill="url(#tieGrad)"/>
    <!-- Sumi ink landscape pattern printed on 100% natural silk -->
    <path d="M -30 180 Q -5 130, 25 170 T 35 250" stroke="#c5a059" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M -40 280 Q 0 210, 38 270" stroke="#edf1f5" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="10" cy="320" r="14" fill="#b93b3b" opacity="0.85"/>
    <circle cx="10" cy="320" r="28" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <text x="300" y="540" font-family="'Noto Serif KR', serif" font-size="18" font-weight="bold" fill="#1c2530" text-anchor="middle">수묵 운무산수 100% 실크 넥타이</text>
  <text x="300" y="565" font-family="'Noto Sans KR', sans-serif" font-size="12" fill="#667280" text-anchor="middle">Premium Silk Jacquard Tie · Thomas Yang Art Collection</text>
</svg>