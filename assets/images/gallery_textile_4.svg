<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <filter id="tapTex">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.4"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <radialGradient id="lotusGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5a8a6a"/>
      <stop offset="100%" stop-color="#2a4a3a"/>
    </radialGradient>
  </defs>
  <!-- Tapestry deep background -->
  <rect width="720" height="480" fill="url(#lotusGrad)"/>
  <rect width="720" height="480" fill="#2a4a3a" opacity="0.4" filter="url(#tapTex)"/>
  <!-- Blue water -->
  <rect x="0" y="300" width="720" height="180" fill="#1a4a7a" opacity="0.7"/>
  <!-- Water ripples -->
  <g stroke="#2a6aaa" stroke-width="1" fill="none" opacity="0.5">
    <ellipse cx="180" cy="380" rx="60" ry="10"/>
    <ellipse cx="380" cy="400" rx="80" ry="12"/>
    <ellipse cx="560" cy="390" rx="55" ry="9"/>
  </g>
  <!-- Lily pads -->
  <g fill="#2a6a3a" stroke="#1a4a2a" stroke-width="1.5">
    <ellipse cx="150" cy="310" rx="55" ry="22"/>
    <ellipse cx="380" cy="320" rx="70" ry="28"/>
    <ellipse cx="590" cy="315" rx="55" ry="22"/>
    <ellipse cx="80" cy="340" rx="35" ry="14"/>
    <ellipse cx="500" cy="340" rx="45" ry="18"/>
    <!-- Notch cuts in lily pads (folk art style) -->
    <path d="M150,288 L150,310" stroke="#1a4a2a" stroke-width="2" fill="none"/>
    <path d="M380,292 L380,320" stroke="#1a4a2a" stroke-width="2" fill="none"/>
  </g>
  <!-- Lotus stems -->
  <g stroke="#2a5a2a" stroke-width="3" fill="none">
    <line x1="150" y1="310" x2="150" y2="200"/>
    <line x1="380" y1="320" x2="380" y2="160"/>
    <line x1="590" y1="315" x2="590" y2="210"/>
    <line x1="260" y1="330" x2="260" y2="230"/>
    <line x1="490" y1="340" x2="490" y2="240"/>
  </g>
  <!-- Lotus flowers - bold pink folk art style -->
  <g>
    <!-- Lotus 1 -->
    <g transform="translate(150,180)">
      <ellipse cx="0" cy="0" rx="30" ry="40" fill="#e87090" stroke="#2a1a1a" stroke-width="1.5"/>
      <ellipse cx="-20" cy="10" rx="18" ry="30" fill="#e87090" stroke="#2a1a1a" stroke-width="1.5" transform="rotate(-25)"/>
      <ellipse cx="20" cy="10" rx="18" ry="30" fill="#e87090" stroke="#2a1a1a" stroke-width="1.5" transform="rotate(25)"/>
      <ellipse cx="-10" cy="5" rx="12" ry="22" fill="#f4a0b8" stroke="#2a1a1a" stroke-width="1"/>
      <ellipse cx="10" cy="5" rx="12" ry="22" fill="#f4a0b8" stroke="#2a1a1a" stroke-width="1"/>
      <circle cx="0" cy="-5" r="12" fill="#f4c030" stroke="#2a1a1a" stroke-width="1"/>
    </g>
    <!-- Lotus 2 (bigger, center) -->
    <g transform="translate(380,140)">
      <ellipse cx="0" cy="0" rx="38" ry="50" fill="#e06080" stroke="#2a1a1a" stroke-width="2"/>
      <ellipse cx="-28" cy="12" rx="22" ry="38" fill="#e06080" stroke="#2a1a1a" stroke-width="1.5" transform="rotate(-28)"/>
      <ellipse cx="28" cy="12" rx="22" ry="38" fill="#e06080" stroke="#2a1a1a" stroke-width="1.5" transform="rotate(28)"/>
      <ellipse cx="-14" cy="6" rx="15" ry="28" fill="#f8b0c8" stroke="#2a1a1a" stroke-width="1"/>
      <ellipse cx="14" cy="6" rx="15" ry="28" fill="#f8b0c8" stroke="#2a1a1a" stroke-width="1"/>
      <circle cx="0" cy="-8" r="15" fill="#f4c030" stroke="#2a1a1a" stroke-width="1.5"/>
    </g>
    <!-- Lotus 3 -->
    <g transform="translate(590,195)">
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="#e87090" stroke="#2a1a1a" stroke-width="1.5"/>
      <ellipse cx="-18" cy="10" rx="16" ry="28" fill="#e87090" stroke="#2a1a1a" stroke-width="1" transform="rotate(-25)"/>
      <ellipse cx="18" cy="10" rx="16" ry="28" fill="#e87090" stroke="#2a1a1a" stroke-width="1" transform="rotate(25)"/>
      <circle cx="0" cy="-5" r="10" fill="#f4c030" stroke="#2a1a1a" stroke-width="1"/>
    </g>
    <!-- Lotus bud 4 -->
    <g transform="translate(260,215)">
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#f09aae" stroke="#2a1a1a" stroke-width="1.5"/>
      <ellipse cx="-10" cy="5" rx="10" ry="20" fill="#f09aae" stroke="#2a1a1a" stroke-width="1" transform="rotate(-20)"/>
    </g>
  </g>
  <!-- Border decoration - folk art frame -->
  <rect x="0" y="0" width="720" height="480" fill="none" stroke="#8b5a2a" stroke-width="8"/>
  <rect x="8" y="8" width="704" height="464" fill="none" stroke="#f4c030" stroke-width="2" opacity="0.7"/>
  <!-- Artist text -->
  <text x="680" y="460" font-family="'Noto Serif KR', serif" font-size="16" fill="#f4c030" opacity="0.9" text-anchor="end">梁太白</text>
  <text x="30" y="460" font-family="'Noto Serif KR', serif" font-size="13" fill="#f0d080" opacity="0.8">민화 연화도 태피스트리</text>
</svg>
