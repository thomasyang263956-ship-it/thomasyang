<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <filter id="ricePaper">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.15"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <!-- Warm rice paper background -->
  <rect width="720" height="480" fill="#f0ebe0"/>
  <rect width="720" height="480" fill="#e8e0cc" opacity="0.5" filter="url(#ricePaper)"/>
  <!-- Inner frame -->
  <rect x="40" y="40" width="640" height="400" fill="none" stroke="#c0aa80" stroke-width="1" opacity="0.4"/>
  <!-- Large calligraphy characters - 知足常樂 -->
  <!-- 知 -->
  <text x="130" y="300" font-family="'Noto Serif KR', serif" font-size="140" font-weight="bold" fill="#1a1a1a" text-anchor="middle" opacity="0.92">知</text>
  <!-- 足 -->
  <text x="300" y="300" font-family="'Noto Serif KR', serif" font-size="140" font-weight="bold" fill="#1a1a1a" text-anchor="middle" opacity="0.92">足</text>
  <!-- 常 -->
  <text x="470" y="300" font-family="'Noto Serif KR', serif" font-size="140" font-weight="bold" fill="#1a1a1a" text-anchor="middle" opacity="0.92">常</text>
  <!-- 樂 -->
  <text x="640" y="300" font-family="'Noto Serif KR', serif" font-size="140" font-weight="bold" fill="#1a1a1a" text-anchor="middle" opacity="0.92">樂</text>
  <!-- Red seal stamp in bottom right -->
  <rect x="638" y="400" width="62" height="62" rx="2" fill="#cc2222"/>
  <text x="669" y="425" font-family="'Noto Serif KR', serif" font-size="11" fill="#f4f0e8" text-anchor="middle">梁</text>
  <text x="669" y="440" font-family="'Noto Serif KR', serif" font-size="11" fill="#f4f0e8" text-anchor="middle">太</text>
  <text x="669" y="455" font-family="'Noto Serif KR', serif" font-size="11" fill="#f4f0e8" text-anchor="middle">白</text>
  <!-- Author text -->
  <text x="360" y="440" font-family="'Noto Serif KR', serif" font-size="14" fill="#4a3a2a" text-anchor="middle" opacity="0.7">梁太白 書</text>
</svg>
